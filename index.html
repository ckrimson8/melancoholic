
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111519">
<title>Wimpy Music Player</title>

<style>
:root {
  --bg: #111519;
  --panel: #1b2227;
  --line: #303a40;
  --text: #edf2f2;
  --muted: #8d9a9e;
  --accent: #43c59e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.player {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 22px;
  box-shadow: 0 18px 50px #0006;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo {
  width: 30px;
  height: 30px;
  background: var(--accent);
  color: #10231e;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font-size: 19px;
}

.online {
  color: var(--accent);
  font-size: 9px;
  letter-spacing: 1px;
}

.cover {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 220px;
  margin: auto;
  border-radius: 9px;
  overflow: hidden;
  background: #283239;
  display: grid;
  place-items: center;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.placeholder {
  font-size: 65px;
  color: #71817f;
}

.info {
  text-align: center;
  margin: 20px 0;
  min-height: 48px;
}

#title {
  font-size: 17px;
  font-weight: bold;
}

#artist {
  color: var(--muted);
  font-size: 12px;
  margin-top: 7px;
}

input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.times {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 19px 0;
}

button {
  border: 0;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  font-size: 19px;
  padding: 7px;
}

button:hover, button.active {
  color: var(--accent);
}

#play {
  width: 49px;
  height: 49px;
  border-radius: 50%;
  background: var(--accent);
  color: #10231e;
  font-size: 21px;
}

#play:hover {
  background: #65d9b6;
}

.volume {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
  margin: 16px 0 20px;
}

.volume input {
  flex: 1;
}

.section {
  border-top: 1px solid var(--line);
  padding-top: 17px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

#count {
  color: var(--muted);
  font-weight: normal;
  letter-spacing: 0;
}

#playlist {
  margin-top: 10px;
  max-height: 210px;
  overflow-y: auto;
}

.track {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}

.track:hover {
  background: #273137;
}

.track.active {
  color: var(--accent);
  background: #25352f;
}

.track-number {
  color: var(--muted);
  width: 17px;
}

.track-details {
  flex: 1;
  min-width: 0;
}

.track-name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.track-artist {
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

#status {
  color: var(--muted);
  font-size: 10px;
  text-align: center;
  margin-top: 17px;
  min-height: 13px;
}

button:focus-visible, input:focus-visible,
.track:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media(max-width:400px) {
  .player { padding: 17px; }
  .controls { gap: 14px; }
}
</style>
</head>

<body>

<main class="player">

  <header class="header">
    <div class="brand">
      <div class="logo">♫</div>
      WIMPY MUSIC
    </div>
    <span class="online">● ONLINE</span>
  </header>

  <div class="cover">
    <div class="placeholder" id="placeholder">♫</div>
    <img id="cover" alt="Portada del álbum">
  </div>

  <div class="info">
    <div id="title">Cargando reproductor...</div>
    <div id="artist">Mi colección musical</div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <input id="progress" type="range"
         min="0" max="100" value="0"
         aria-label="Progreso de reproducción">

  <div class="times">
    <span id="current">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="shuffle" title="Reproducción aleatoria"
            aria-label="Reproducción aleatoria">⤨</button>

    <button id="prev" title="Anterior"
            aria-label="Anterior">|◀</button>

    <button id="play" title="Reproducir"
            aria-label="Reproducir">▶</button>

    <button id="next" title="Siguiente"
            aria-label="Siguiente">▶|</button>

    <button id="repeat" title="Repetición desactivada"
            aria-label="Cambiar repetición">↻</button>
  </div>

  <div class="volume">
    <span>VOL</span>
    <input id="volume" type="range"
           min="0" max="1" step="0.01" value="0.8"
           aria-label="Volumen">
  </div>

  <section class="section">
    <div class="section-title">
      <span>PLAYLIST</span>
      <span id="count">0 canciones</span>
    </div>
    <div id="playlist"></div>
  </section>

  <div id="status" role="status" aria-live="polite">
    Preparando...
  </div>

</main>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("play");
const playlistDiv = document.getElementById("playlist");

const progress = document.getElementById("progress");
const shuffleBtn = document.getElementById("shuffle");
const repeatBtn = document.getElementById("repeat");

let tracks = [];
let currentIndex = 0;
let shuffle = false;
let repeatMode = 0;
// 0 = apagado, 1 = repetir lista, 2 = repetir canción

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ":" + String(s).padStart(2, "0");
}

async function loadPlaylist() {
  try {
    const response = await fetch("playlist.json");

    if (!response.ok) {
      throw new Error("No se encontró playlist.json");
    }

    const data = await response.json();

    if (!Array.isArray(data) || !data.length) {
      throw new Error("La lista está vacía");
    }

    tracks = data.filter(track =>
      track &&
      typeof track.url === "string" &&
      /^https?:\/\//i.test(track.url)
    );

    if (!tracks.length) {
      throw new Error("No hay canciones con URL válida");
    }

    document.getElementById("count").textContent =
      tracks.length + " canciones";

    renderPlaylist();
    loadTrack(0);

    setStatus("LISTO · " + tracks.length + " CANCIONES");

  } catch (error) {
    setStatus("ERROR: " + error.message);
  }
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function renderPlaylist() {
  playlistDiv.innerHTML = "";

  tracks.forEach((track, index) => {
    const item = document.createElement("div");
    item.className = "track";
    item.tabIndex = 0;

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = String(index + 1).padStart(2, "0");

    const details = document.createElement("div");
    details.className = "track-details";

    const name = document.createElement("div");
    name.className = "track-name";
    name.textContent = track.title || "Sin título";

    const artist = document.createElement("div");
    artist.className = "track-artist";
    artist.textContent = track.artist || "Artista desconocido";

    details.append(name, artist);
    item.append(number, details);

    item.addEventListener("click", () => {
      loadTrack(index);
      playAudio();
    });

    item.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        loadTrack(index);
        playAudio();
      }
    });

    playlistDiv.appendChild(item);
  });

  updateActiveTrack();
}

function updateActiveTrack() {
  document.querySelectorAll(".track").forEach((item, index) => {
    item.classList.toggle("active", index === currentIndex);
  });
}

function loadTrack(index) {
  if (!tracks.length) return;

  currentIndex = (index + tracks.length) % tracks.length;

  const track = tracks[currentIndex];

  audio.src = track.url;

  document.getElementById("title").textContent =
    track.title || "Sin título";

  document.getElementById("artist").textContent =
    track.artist || "Artista desconocido";

  const cover = document.getElementById("cover");
  const placeholder = document.getElementById("placeholder");

  cover.onerror = () => {
    cover.style.display = "none";
    placeholder.style.display = "block";
  };

  if (track.cover) {
    cover.src = track.cover;
    cover.style.display = "block";
    placeholder.style.display = "none";
  } else {
    cover.style.display = "none";
    placeholder.style.display = "block";
  }

  progress.value = 0;
  document.getElementById("current").textContent = "0:00";
  document.getElementById("duration").textContent = "0:00";

  updateActiveTrack();

  setStatus("CARGADA · " + (track.title || "SIN TÍTULO"));
}

async function playAudio() {
  try {
    await audio.play();
  } catch (error) {
    setStatus("No se pudo reproducir. Comprueba el enlace de audio.");
  }
}

function pauseAudio() {
  audio.pause();
}

function nextTrack() {
  if (!tracks.length) return;

  if (shuffle && tracks.length > 1) {
    let next;
    do {
      next = Math.floor(Math.random() * tracks.length);
    } while (next === currentIndex);

    loadTrack(next);
  } else {
    if (currentIndex === tracks.length - 1 && repeatMode === 0) {
      pauseAudio();
      audio.currentTime = 0;
      return;
    }

    loadTrack(currentIndex + 1);
  }

  playAudio();
}

function previousTrack() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  loadTrack(currentIndex - 1);
  playAudio();
}

playBtn.addEventListener("click", () => {
  if (audio.paused) playAudio();
  else pauseAudio();
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
  playBtn.setAttribute("aria-label", "Pausar");
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  playBtn.setAttribute("aria-label", "Reproducir");
});

document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("prev").addEventListener("click", previousTrack);

audio.addEventListener("ended", () => {
  if (repeatMode === 2) {
    audio.currentTime = 0;
    playAudio();
  } else if (
    currentIndex === tracks.length - 1 &&
    !shuffle &&
    repeatMode === 0
  ) {
    pauseAudio();
    audio.currentTime = 0;
  } else {
    nextTrack();
  }
});

shuffleBtn.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("active", shuffle);
  setStatus(shuffle ? "REPRODUCCIÓN ALEATORIA" : "ORDEN NORMAL");
});

repeatBtn.addEventListener("click", () => {
  repeatMode = (repeatMode + 1) % 3;

  repeatBtn.classList.toggle("active", repeatMode !== 0);

  const labels = [
    "REPETICIÓN DESACTIVADA",
    "REPETIR LISTA",
    "REPETIR CANCIÓN"
  ];

  repeatBtn.textContent = repeatMode === 2 ? "↻¹" : "↻";
  repeatBtn.title = labels[repeatMode];
  setStatus(labels[repeatMode]);
});

audio.addEventListener("timeupdate", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = audio.currentTime / audio.duration * 100;
    document.getElementById("current").textContent =
      formatTime(audio.currentTime);
  }
});

audio.addEventListener("loadedmetadata", () => {
  document.getElementById("duration").textContent =
    formatTime(audio.duration);
});

audio.addEventListener("error", () => {
  setStatus("ERROR DE AUDIO · Comprueba la URL");
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = progress.value / 100 * audio.duration;
  }
});

document.getElementById("volume").addEventListener("input", event => {
  audio.volume = Number(event.target.value);
});

audio.volume = 0.8;

loadPlaylist();
</script>

</body>
</html>
